behaviors:
  ParasaurolophusWalk:  
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048        
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512       
      num_layers: 3          
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:             
        gamma: 0.99
        strength: 0.02
        network_settings:
          hidden_units: 256
        learning_rate: 0.0001
    keep_checkpoints: 50    
    checkpoint_interval: 1000000 
    max_steps: 30000000       
    time_horizon: 64
    summary_freq: 20000       


environment_parameters:
  curriculum_level:
    curriculum:
      
      - name: Lesson0_Straight_Rigid
        completion_criteria:
          measure: reward
          behavior: Parasaurolophus
          threshold: 30.0     
          min_lesson_length: 200
        value: 0.0
      
     
      - name: Lesson1_Stabilize
        completion_criteria:
          measure: reward
          behavior: Parasaurolophus
          threshold: 8.0     
          min_lesson_length: 100
        value: 1.0
      

      - name: Lesson2_Turning
        completion_criteria:
          measure: reward
          behavior: Parasaurolophus
          threshold: 10.0    
          min_lesson_length: 100
        value: 2.0


      - name: Lesson3_SpeedControl
        completion_criteria:
          measure: reward
          behavior: Parasaurolophus
          threshold: 15.0    
          min_lesson_length: 100
        value: 3.0

   
      - name: Lesson4_Master
        value: 4.0